[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yakutia-profile-climate"
version = "0.2.0"
description = "Декодирование BUFR и климатология аэрологических станций"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=1.26", "pyyaml>=6", "requests>=2.31", "pybufrkit>=0.2.5",
  "metpy>=1.6", "matplotlib>=3.8", "openpyxl>=3.1", "pandas>=2",
  "streamlit>=1.50", "plotly>=5.18",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gdex-extract = "gdex_bufr.profile_climate.fast_pipeline:main"

[tool.setuptools]
py-modules = ["run_fast_extract", "pool_decode_worker"]

[tool.setuptools.packages.find]
include = ["gdex_bufr*"]
exclude = ["tests*"]
